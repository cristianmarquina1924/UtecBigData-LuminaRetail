<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" style="background:#0F172A; font-family:'Segoe UI', Inter, sans-serif;">
  <defs>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <!-- HEADER -->
  <rect x="0" y="0" width="1200" height="70" fill="url(#headerGrad3)"/>
  <text x="600" y="44" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FLUJO REAL DE DATOS END-TO-END: GCS PARQUET → BIGQUERY SILVER → BIGQUERY GOLD</text>

  <!-- PASO 1: GCS BRONZE / SILVER & DATAPROC -->
  <rect x="40" y="95" width="340" height="370" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2" filter="url(#shadow3)"/>
  <rect x="40" y="95" width="340" height="42" rx="12" fill="#0284C7"/>
  <text x="210" y="122" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PASO 1: GCS SILVER (PARQUET) &amp; DATAPROC</text>

  <rect x="60" y="155" width="300" height="85" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="75" y="180" font-size="13" font-weight="bold" fill="#38BDF8">Cloud Dataproc (PySpark 3.x)</text>
  <text x="75" y="200" font-size="11" fill="#94A3B8">• Script: 01_dataproc_bronze_to_silver_etl.py</text>
  <text x="75" y="220" font-size="11" fill="#4ADE80">✔ Filtro de cancelaciones con signo contable</text>

  <rect x="60" y="255" width="300" height="185" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="75" y="280" font-size="13" font-weight="bold" fill="#FBBF24">Rutas de Cloud Storage Silver:</text>
  <text x="75" y="305" font-size="10.5" fill="#E2E8F0">gs://...-silver/uci_transactions_clean/</text>
  <text x="75" y="325" font-size="10.5" fill="#94A3B8">  └ Particionado por Country, is_cancelled</text>
  <text x="75" y="350" font-size="10.5" fill="#E2E8F0">gs://...-silver/olist_logistics_enriched/</text>
  <text x="75" y="370" font-size="10.5" fill="#94A3B8">  └ Particionado por state_code (Tri-estado SLA)</text>
  <text x="75" y="395" font-size="10.5" fill="#E2E8F0">gs://...-silver/dim_products_unidades/</text>
  <text x="75" y="415" font-size="10.5" fill="#94A3B8">  └ 12 Unidades de Negocio homologadas</text>

  <!-- FLECHA PASO 1 A PASO 2 -->
  <line x1="380" y1="280" x2="430" y2="280" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrow3)"/>

  <!-- PASO 2: BIGQUERY SILVER -->
  <rect x="440" y="95" width="340" height="370" rx="12" fill="#1E293B" stroke="#818CF8" stroke-width="2" filter="url(#shadow3)"/>
  <rect x="440" y="95" width="340" height="42" rx="12" fill="#4F46E5"/>
  <text x="610" y="122" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PASO 2: BIGQUERY SILVER DATASET</text>

  <rect x="460" y="155" width="300" height="285" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="475" y="180" font-size="13" font-weight="bold" fill="#818CF8">Tablas Silver Estandarizadas (777,178 filas):</text>
  
  <text x="475" y="210" font-size="12" font-weight="bold" fill="#E2E8F0">1. lumina_silver.stg_thelook_orders_clean</text>
  <text x="475" y="230" font-size="11" fill="#94A3B8">• 125,136 filas | QUALIFY ROW_NUMBER() dedup</text>
  
  <text x="475" y="260" font-size="12" font-weight="bold" fill="#E2E8F0">2. lumina_silver.stg_olist_orders_items</text>
  <text x="475" y="280" font-size="11" fill="#94A3B8">• 112,650 filas reales | BRL | Fechas entrega NULL</text>
  
  <text x="475" y="310" font-size="12" font-weight="bold" fill="#E2E8F0">3. lumina_silver.stg_uci_retail_transactions</text>
  <text x="475" y="330" font-size="11" fill="#94A3B8">• 539,392 filas reales | GBP | Devoluciones (-qty)</text>

  <rect x="475" y="360" width="270" height="65" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="485" y="385" font-size="11" fill="#38BDF8">Carga desde GCS Bronze/Silver:</text>
  <text x="485" y="405" font-size="10.5" fill="#4ADE80">✔ BQ LoadJobConfig + Partición por Día</text>

  <!-- FLECHA PASO 2 A PASO 3 -->
  <line x1="780" y1="280" x2="830" y2="280" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrow3)"/>

  <!-- PASO 3: BIGQUERY GOLD & MARTS -->
  <rect x="840" y="95" width="320" height="370" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2" filter="url(#shadow3)"/>
  <rect x="840" y="95" width="320" height="42" rx="12" fill="#D97706"/>
  <text x="1000" y="122" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PASO 3: BIGQUERY GOLD &amp; DATA MARTS</text>

  <rect x="860" y="155" width="280" height="285" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="875" y="180" font-size="13" font-weight="bold" fill="#FBBF24">Modelado Dimensional Canónico:</text>
  
  <text x="875" y="210" font-size="11.5" font-weight="bold" fill="#E2E8F0">• dim_exchange_rates (USD, BRL, GBP)</text>
  <text x="875" y="230" font-size="11.5" font-weight="bold" fill="#E2E8F0">• dim_business_unit_mapping (12 UNs)</text>
  <text x="875" y="250" font-size="11.5" font-weight="bold" fill="#E2E8F0">• dim_customers_360 (100k registros)</text>
  
  <text x="875" y="280" font-size="12" font-weight="bold" fill="#34D399">fact_multisource_unified_sales</text>
  <text x="875" y="300" font-size="11" fill="#94A3B8">• 833,648 filas reales (Granularidad artículo)</text>
  <text x="875" y="320" font-size="11" fill="#94A3B8">• Conversión de divisas transparente a USD</text>

  <text x="875" y="350" font-size="12" font-weight="bold" fill="#38BDF8">mart_cross_source_intelligence</text>
  <text x="875" y="370" font-size="11" fill="#94A3B8">• 1,030 filas agrupadas por Mes, UN y Canal</text>

  <text x="875" y="400" font-size="12" font-weight="bold" fill="#818CF8">mart_daily_unit_kpis</text>
  <text x="875" y="420" font-size="11" fill="#94A3B8">• 127,285 filas diarias de rendimiento logístico</text>
</svg>

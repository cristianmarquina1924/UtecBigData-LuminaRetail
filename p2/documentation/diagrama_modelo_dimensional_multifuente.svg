<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" style="background:#0B1120; font-family:'Segoe UI', Inter, sans-serif;">
  <defs>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- TITULO -->
  <rect x="0" y="0" width="1200" height="65" fill="url(#headerGrad2)"/>
  <text x="600" y="40" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MODELO RELACIONAL MULTIFUENTE · BIGQUERY CAPA GOLD</text>

  <!-- DIMENSION PRODUCTOS (12 UNIDADES) -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="300" height="230" rx="8" fill="url(#boxGrad)" stroke="#38BDF8" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="35" rx="8" fill="#0284C7"/>
    <text x="150" y="23" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">dim_products_business_units</text>
    <text x="15" y="60" font-size="11" font-weight="bold" fill="#FBBF24">PK: product_id (INT64)</text>
    <text x="15" y="80" font-size="11" fill="#E2E8F0">FK: business_unit_id (STRING - 12 Unidades)</text>
    <text x="15" y="100" font-size="11" fill="#94A3B8">• product_name (STRING)</text>
    <text x="15" y="120" font-size="11" fill="#94A3B8">• brand (STRING)</text>
    <text x="15" y="140" font-size="11" fill="#94A3B8">• category (STRING)</text>
    <text x="15" y="160" font-size="11" fill="#94A3B8">• department (STRING)</text>
    <text x="15" y="180" font-size="11" fill="#94A3B8">• unit_cost, retail_price (FLOAT64)</text>
    <text x="15" y="200" font-size="11" fill="#94A3B8">• gross_margin_pct (FLOAT64)</text>
    <text x="15" y="220" font-size="11" font-weight="bold" fill="#4ADE80">29,120 Registros | Cluster: business_unit_id</text>
  </g>

  <!-- DIMENSION CLIENTES THELOOK 360 -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="300" height="230" rx="8" fill="url(#boxGrad)" stroke="#818CF8" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="35" rx="8" fill="#4F46E5"/>
    <text x="150" y="23" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">dim_customers_thelook</text>
    <text x="15" y="60" font-size="11" font-weight="bold" fill="#FBBF24">PK: user_id (INT64)</text>
    <text x="15" y="80" font-size="11" fill="#E2E8F0">customer_sk (STRING - SHA256)</text>
    <text x="15" y="100" font-size="11" fill="#94A3B8">• masked_first_name, masked_email (PII)</text>
    <text x="15" y="120" font-size="11" fill="#94A3B8">• age, gender (INT64, STRING)</text>
    <text x="15" y="140" font-size="11" fill="#94A3B8">• state, city, country (STRING)</text>
    <text x="15" y="160" font-size="11" fill="#94A3B8">• customer_location (STRUCT&lt;lat, lng&gt;)</text>
    <text x="15" y="180" font-size="11" fill="#94A3B8">• registration_date (DATE)</text>
    <text x="15" y="200" font-size="11" fill="#94A3B8">• traffic_source (STRING)</text>
    <text x="15" y="220" font-size="11" font-weight="bold" fill="#4ADE80">100,000 Clientes | Cluster: state, country</text>
  </g>

  <!-- TABLA DE HECHOS UNIFICADA MULTIFUENTE (CENTRO) -->
  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="370" height="490" rx="10" fill="url(#boxGrad)" stroke="#F59E0B" stroke-width="2.5"/>
    <rect x="0" y="0" width="370" height="40" rx="10" fill="#D97706"/>
    <text x="185" y="26" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">fact_multisource_unified_sales</text>
    
    <text x="20" y="65" font-size="12" font-weight="bold" fill="#FBBF24">PK: line_item_id + source_system (STRING)</text>
    <text x="20" y="85" font-size="11" font-weight="bold" fill="#38BDF8">FK: business_unit_id $\rightarrow$ dim_products</text>
    <text x="20" y="105" font-size="11" fill="#E2E8F0">• source_system: 'THELOOK' | 'OLIST' | 'UCI_RETAIL'</text>
    <text x="20" y="125" font-size="11" fill="#E2E8F0">• order_id (STRING)</text>
    <text x="20" y="145" font-size="11" fill="#E2E8F0">• sale_date (DATE) - [PARTITION KEY]</text>
    <text x="20" y="165" font-size="11" fill="#E2E8F0">• transaction_timestamp (TIMESTAMP)</text>
    <text x="20" y="185" font-size="11" fill="#94A3B8">• category_name (STRING)</text>
    <text x="20" y="205" font-size="11" fill="#94A3B8">• country, region_state (STRING)</text>
    <text x="20" y="225" font-size="11" fill="#94A3B8">• quantity_sold (INT64)</text>
    <text x="20" y="245" font-size="11" fill="#94A3B8">• unit_price_usd (FLOAT64)</text>
    <text x="20" y="265" font-size="11" fill="#94A3B8">• total_amount_usd (FLOAT64)</text>
    <text x="20" y="285" font-size="11" fill="#94A3B8">• unit_cost_usd (FLOAT64)</text>
    <text x="20" y="305" font-size="11" fill="#94A3B8">• gross_margin_usd, gross_margin_pct (FLOAT64)</text>
    <text x="20" y="325" font-size="11" fill="#94A3B8">• freight_cost_usd (FLOAT64)</text>
    <text x="20" y="345" font-size="11" fill="#94A3B8">• delivery_hours_actual (INT64)</text>
    <text x="20" y="365" font-size="11" fill="#94A3B8">• is_cancelled_or_returned (BOOL)</text>
    <text x="20" y="385" font-size="11" fill="#94A3B8">• raw_status (STRING)</text>
    
    <line x1="20" y1="410" x2="350" y2="410" stroke="#334155" stroke-width="1"/>
    <text x="20" y="435" font-size="12" font-weight="bold" fill="#4ADE80">TOTAL REGISTROS: 833,648 FILAS</text>
    <text x="20" y="455" font-size="11" fill="#94A3B8">Tamaño Lógico: 139.54 MB | BigQuery Native</text>
    <text x="20" y="475" font-size="11" fill="#FBBF24">Cluster: source_system, business_unit, country</text>
  </g>

  <!-- DATA MARTS ANALITICOS (DERECHA) -->
  <g transform="translate(850, 100)">
    <rect x="0" y="0" width="300" height="230" rx="8" fill="url(#boxGrad)" stroke="#10B981" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="35" rx="8" fill="#059669"/>
    <text x="150" y="23" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">mart_cross_source_intelligence</text>
    <text x="15" y="60" font-size="11" font-weight="bold" fill="#FBBF24">BENCHMARK MULTIFUENTE (3 FUENTES)</text>
    <text x="15" y="80" font-size="11" fill="#E2E8F0">• report_month (DATE) - [PARTITION]</text>
    <text x="15" y="100" font-size="11" fill="#E2E8F0">• business_unit_id, source_system</text>
    <text x="15" y="120" font-size="11" fill="#94A3B8">• total_orders, total_units_sold</text>
    <text x="15" y="140" font-size="11" fill="#94A3B8">• gross_revenue_usd, total_margin_usd</text>
    <text x="15" y="160" font-size="11" fill="#94A3B8">• avg_ticket_order_usd</text>
    <text x="15" y="180" font-size="11" fill="#94A3B8">• cancellation_return_rate_pct</text>
    <text x="15" y="200" font-size="11" fill="#94A3B8">• avg_freight_cost_usd, avg_delivery_hours</text>
    <text x="15" y="220" font-size="11" font-weight="bold" fill="#4ADE80">1,413 Filas Agregadas | Looker Ready</text>
  </g>

  <g transform="translate(850, 360)">
    <rect x="0" y="0" width="300" height="230" rx="8" fill="url(#boxGrad)" stroke="#EC4899" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="35" rx="8" fill="#DB2777"/>
    <text x="150" y="23" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">mart_daily_unit_kpis</text>
    <text x="15" y="60" font-size="11" font-weight="bold" fill="#FBBF24">KPIs DIARIOS OPERACIONALES</text>
    <text x="15" y="80" font-size="11" fill="#E2E8F0">• report_date (DATE) - [PARTITION]</text>
    <text x="15" y="100" font-size="11" fill="#E2E8F0">• business_unit_id, state</text>
    <text x="15" y="120" font-size="11" fill="#94A3B8">• total_orders, total_items_sold</text>
    <text x="15" y="140" font-size="11" fill="#94A3B8">• gross_revenue_usd, total_margin_usd</text>
    <text x="15" y="160" font-size="11" fill="#94A3B8">• avg_delivery_hours</text>
    <text x="15" y="180" font-size="11" fill="#94A3B8">• on_time_delivery_sla_pct (SLA 48h)</text>
    <text x="15" y="220" font-size="11" font-weight="bold" fill="#4ADE80">133,617 Filas Agregadas | Diario</text>
  </g>

  <!-- LINEAS DE UNION -->
  <line x1="360" y1="215" x2="420" y2="215" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4"/>
  <line x1="360" y1="475" x2="420" y2="350" stroke="#818CF8" stroke-width="2.5" stroke-dasharray="4"/>
  <line x1="790" y1="215" x2="850" y2="215" stroke="#10B981" stroke-width="2.5"/>
  <line x1="790" y1="350" x2="850" y2="475" stroke="#EC4899" stroke-width="2.5"/>
</svg>
